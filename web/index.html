function paintComposer(){const C=$('#cmp');if(!C)return;
 if(rec){C.innerHTML=`<div class="rc"><i class="rd"></i><span id="rt">0:00</span><span class="mu sm" style="flex:1">Recording</span><button class="btn" onclick="cancelRec()">Cancel</button><button class="btn pri" onclick="stopRec()">${ic('send')}Send</button></div>`;return}
 const d=$('#mx')?.value||'';C.innerHTML=`<input type="file" id="fl" hidden onchange="pickFile(event)"><button class="ib" aria-label="Attach a photo or file" onclick="$('#fl').click()">${ic('clip')}</button><textarea id="mx" rows="1" maxlength="4000" placeholder="Write a message" aria-label="Message"></textarea><button class="ib" id="mic" aria-label="Record a voice message" onclick="startRec()">${ic('mic')}</button><button class="btn pri" id="sd" aria-label="Send message" onclick="sendText()">${ic('send')}</button>`;
 const t=$('#mx');t.value=d;t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();sendText()}};t.oninput=()=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'}}
function openConv(id,keep){cur=id;$('#cm')?.classList.add('thr');paintList();paintThread();if(!keep)tick(true);else tick(true);setTimeout(()=>$('#mx')&&!matchMedia('(pointer:coarse)').matches&&$('#mx').focus(),0)}
async function queue(x){if(!cur)return;const it={id:uuid(),uid:me.id,conv:cur,t:Date.now(),kind:'text',body:null,media_id:null,duration_ms:null,...x};
 if(it.blob){it.media_id=uuid();await blPut(it.media_id,it.blob)}
 await obPut(it);await paintMsgs(true);flush()}
function sendText(){const t=$('#mx');if(!t)return;const b=t.value.trim();if(!b)return;t.value='';t.style.height='auto';queue({kind:'text',body:b})}
const netErr=e=>!!e&&(e.name==='TypeError'||e.status>=500||e.status===429),herr=(r,j,d)=>Object.assign(new Error((j&&j.error)||d+' ('+r.status+')'),{status:r.status});
async function flush(){if(cflush||!token||!me)return;cflush=true;try{for(const it of await obAll()){if(it.err)continue;
  try{if(it.blob&&!it.up){const r=await raw('/comm/media/'+it.media_id,{method:'PUT',headers:{'content-type':it.mime||'application/octet-stream','x-conversation':it.conv},body:it.blob});if(!r.ok)throw herr(r,await r.json().catch(()=>({})),'upload failed');it.up=1;await obPut(it)}
   const r=await raw('/comm/conversations/'+it.conv+'/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:it.id,kind:it.kind,body:it.body,media_id:it.media_id,duration_ms:it.duration_ms})});
   const j=await r.json().catch(()=>({}));if(!r.ok)throw herr(r,j,'send failed');
   cmerge(it.conv,[j]);await obDel(it.id);cOnline=true}
  catch(e){if(netErr(e)){cOnline=false;break}it.err=e.message;await obPut(it)}}}finally{cflush=false}
 if(view==='comms'){paintMsgs();paintList()}}
async function retryMsg(id){const it=(await obAll()).find(x=>x.id===id);if(it){delete it.err;await obPut(it);flush();paintMsgs()}}
async function delMsg(id){await obDel(id);paintMsgs()}
async function tick(now){if(view!=='comms'||!token||!me||(cbusy&&!now))return;cbusy=true;
 try{await flush();const l=await api('/comm/conversations');convs=l;try{localStorage.setItem('cm_c',JSON.stringify(l))}catch{}cOnline=true;
  if(cur){const have=loadMsgs(cur),last=have.length?have[have.length-1].seq:null,m=await api('/comm/conversations/'+cur+'/messages'+(last!==null?'?after_seq='+last:''));if(m.length){cmerge(cur,m);await paintMsgs()}}
  paintList()}catch(e){if(netErr(e))cOnline=false}
 finally{cbusy=false;const o=$('#off');if(o)o.hidden=cOnline&&navigator.onLine}}
setInterval(()=>tick(),3000);addEventListener('online',()=>{cOnline=true;flush();tick(true)});addEventListener('offline',()=>{cOnline=false;const o=$('#off');if(o)o.hidden=false});document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick(true)});
/* attachments */
const MAXB=10*1024*1024;
async function shrink(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type))return f;try{const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return b&&b.size<f.size?b:f}catch{return f}}
async function pickFile(e){const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>MAXB*2){toast('That file is larger than 10 MB.');return}
 const kind=f.type.startsWith('image/')?'image':f.type.startsWith('audio/')?'audio':'file',b=kind==='image'?await shrink(f):f;
 if(b.size>MAXB){toast('That file is larger than 10 MB.');return}
 queue({kind,blob:b,mime:b.type||f.type||'application/octet-stream',body:kind==='image'?null:f.name.slice(0,120)})}
/* voice notes */
const recMime=()=>['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
async function startRec(){if(rec)return;if(!window.MediaRecorder||!navigator.mediaDevices){toast('Voice messages are not supported in this browser.');return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mt=recMime(),mr=mt?new MediaRecorder(st,{mimeType:mt}):new MediaRecorder(st);
  rec={mr,st,ch:[],t0:Date.now(),send:false};mr.ondataavailable=e=>e.data&&e.data.size&&rec&&rec.ch.push(e.data);
  mr.onstop=()=>{const r=rec;rec=null;r.st.getTracks().forEach(t=>t.stop());clearInterval(r.tm);if(r.send&&r.ch.length){const type=(r.mr.mimeType||mt||'audio/webm').split(';')[0],b=new Blob(r.ch,{type});if(b.size>MAXB)toast('That recording is too long to send.');else queue({kind:'audio',blob:b,mime:type,duration_ms:Date.now()-r.t0})}paintComposer()};
  mr.start();rec.tm=setInterval(()=>{const s=$('#rt');if(s)s.textContent=dur(Date.now()-rec.t0);if(rec&&Date.now()-rec.t0>300000)stopRec()},500);paintComposer()}
 catch(e){rec=null;toast('Microphone access was blocked. Allow it in your browser settings to send voice messages.')}}
function stopRec(){if(rec){rec.send=true;rec.mr.stop()}}function cancelRec(){if(rec){rec.send=false;rec.mr.stop()}}
/* pairing */
function openPair(){const P=$('#pn');P.setAttribute('aria-label','Pair with someone');P.innerHTML=`<div class="hd" style="margin-bottom:8px"><h1>Pair with someone</h1><button class="ib" aria-label="Close" onclick="closePanel()">${ic('x')}</button></div><p class="mu" style="margin:0 0 16px">Pairing links two accounts so they can chat. One person shares a code, the other enters it.</p><div class="card cp"><h2>Share your code</h2><p class="mu sm" style="margin:4px 0 10px">The code works once and expires after 15 minutes.</p><div id="pcode"></div><button class="btn" onclick="getCode()">Get a code</button></div><div class="card cp" style="margin-top:14px"><h2>Enter a code</h2><label for="jc">Code from the other person</label><input id="jc" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="ABCD2345" style="letter-spacing:.15em;text-transform:uppercase" onkeydown="event.key==='Enter'&&joinCode()"><p class="err" id="jerr" role="alert"></p><button class="btn pri" onclick="joinCode()">Pair</button></div>`;P.hidden=$('#scrim').hidden=false}
async function getCode(){await act(async()=>{const j=await api('/comm/pair/code',{method:'POST'});const box=$('#pcode');if(!box)return;clearInterval(codeT);let left=j.expires_in;const show=()=>{box.innerHTML=left>0?`<div class="code" aria-label="Your pairing code">${esc(j.code)}</div><p class="mu sm" style="margin:6px 0 10px">Expires in ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</p><button class="btn" style="margin-bottom:10px" onclick="copyCode('${j.code}')">Copy code</button>`:'<p class="mu sm">That code expired. Get a new one.</p>'};show();codeT=setInterval(()=>{left--;if(!$('#pcode')||left<0){clearInterval(codeT);return}show()},1000)})}
function copyCode(c){navigator.clipboard?.writeText(c).then(()=>toast('Code copied'),()=>toast('Copy failed. Select the code and copy it.'))}
async function joinCode(){const code=($('#jc').value||'').trim();if(!code){$('#jerr').textContent='Enter the code the other person shared.';return}
 try{const j=await api('/comm/pair/join',{method:'POST',body:JSON.stringify({code})});clearInterval(codeT);closePanel();toast('Paired with '+j.peer.name);convs=await api('/comm/conversations');try{localStorage.setItem('cm_c',JSON.stringify(convs))}catch{}if(view!=='comms'){view='comms';cur=j.id;render()}else openConv(j.id)}catch(e){$('#jerr').textContent=e.message}}

/* finance */
async function vFinance(){
 const td=today();
 const [ov,tx,bg,db,ins]=await Promise.all([api('/finance/overview'),api('/finance/transactions'),api('/finance/budgets'),api('/finance/debts'),api('/finance/insights?months=6')]);
 const money=(n,c=PREFS.currency)=>c==='NGN'?'₦'+(+n).toLocaleString('en-NG',{maximumFractionDigits:2}):(+n).toLocaleString(undefined,{maximumFractionDigits:2})+' '+c;
 const md=d=>gdate(d);
 const stat=(l,v)=>`<div><b>${v}</b><span class="mu sm">${l}</span></div>`;
 const oc=(ov.other_currencies||[]).map(c=>money(c.balance,c.currency)).join(' · ');
 const months=ins.months||[],mx=Math.max(1,...months.flatMap(m=>[+m.income,+m.expense]));
 const bars=months.map(m=>`<div class="fbar" title="${m.month}: in ${money(m.income)}, out ${money(m.expense)}"><div class="fbcol"><i class="in" style="height:${(+m.income/mx*60).toFixed(0)}px"></i><i class="ex" style="height:${(+m.expense/mx*60).toFixed(0)}px"></i></div><span class="mu sm">${m.month.slice(5)}</span></div>`).join('');
 const cats=ins.by_category||[],catmax=Math.max(1,...cats.map(c=>+c.amount));
 const catrows=cats.length?cats.map(c=>`<div class="prow"><div class="plab"><span>${esc(c.category)}</span><span class="mu sm">${money(c.amount)}</span></div><div class="pbar"><i style="width:${(+c.amount/catmax*100).toFixed(0)}%"></i></div></div>`).join(''):'<p class="mu sm">No expenses logged this month.</p>';
 const brows=bg.length?bg.map(b=>{const over=+b.spent>+b.limit_amount,pct=b.limit_amount>0?Math.min(100,+b.spent/+b.limit_amount*100):0;return `<div class="prow"><div class="plab"><span>${esc(b.category)}</span><span class="mu sm ${over?'er':''}">${money(b.spent,b.currency)} / ${money(b.limit_amount,b.currency)}</span></div><div class="pbar"><i class="${over?'over':''}" style="width:${pct.toFixed(0)}%"></i></div><button class="ib" aria-label="Remove budget" onclick="rm('/finance/budgets/${b.id}')">${ic('trash')}</button></div>`}).join(''):'<p class="mu sm" style="margin:6px 0">No budgets set for this month.</p>';
 const drows=db.length?db.map(d=>`<div class="row"><div class="tb"><div class="tt">${esc(d.creditor)} <span class="pill ${d.status}">${d.status}</span></div><div class="meta">${money(d.outstanding,d.currency)} left of ${money(d.original_amount,d.currency)}${d.interest_rate?' · '+d.interest_rate+'%':''}</div>${d.status==='open'?`<div class="chips" style="margin:6px 0 0"><input id="rp_${d.id}" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Repay amount" style="width:150px"><button class="btn" onclick="repay('${d.id}')">Record repayment</button></div>`:''}</div></div>`).join(''):'<p class="mu sm" style="margin:6px 0">No debts tracked.</p>';
 const trows=tx.length?tx.slice(0,15).map(t=>`<div class="row"><div class="tb"><div class="tt">${esc(t.category)}${t.description?' <span class="mu">— '+esc(t.description)+'</span>':''}</div><div class="meta">${md(t.occurred_on)} · ${t.kind}</div></div><div style="display:flex;align-items:center;gap:8px"><b class="${t.kind==='income'?'pos':'neg'}">${t.kind==='income'?'+':'−'}${money(t.amount,t.currency)}</b><button class="ib" aria-label="Delete transaction" onclick="rm('/finance/transactions/${t.id}')">${ic('trash')}</button></div></div>`).join(''):'<p class="mu sm" style="margin:6px 0">No transactions yet.</p>';
 return `<div class="hd"><div><h1>Finance</h1><p class="mu">Money in and out, budgets and debts · NGN</p></div></div><div class="grid">
  <section class="card cp c12"><div class="stats">${stat('Balance',money(ov.balance))}${stat('This month in',money(ov.month_income))}${stat('This month out',money(ov.month_expense))}${stat('Saved this month',money(ov.month_savings))}${stat('Debt outstanding',money(ov.debt_outstanding))}</div>${oc?`<p class="mu sm" style="margin:10px 0 0">Other currencies: ${oc}</p>`:''}</section>
  <section class="card cp c7"><h2>Add a transaction</h2>
   <div class="chips" style="margin:6px 0 0"><select id="fkind"><option value="expense">Expense</option><option value="income">Income</option></select><input id="famt" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Amount" style="width:130px"><input id="fcat" placeholder="Category e.g. food" style="width:160px"></div>
   <div class="chips" style="margin:8px 0 0"><input id="fdesc" placeholder="Note (optional)" style="flex:1;min-width:150px"><input id="fdate" type="date" value="${td}"><button class="btn pri" onclick="addTx()">Add</button></div><p class="err" id="ferr"></p>
   <h2 style="margin-top:14px">Recent</h2>${trows}</section>
  <section class="card cp c5"><h2>Insights</h2><div class="fbars">${bars||'<p class="mu sm">No data yet.</p>'}</div><div class="fleg mu sm"><span><i class="in"></i>Income</span><span><i class="ex"></i>Expense</span></div><h2 style="margin-top:14px">Top spending this month</h2>${catrows}</section>
  <section class="card cp c7"><h2>Budgets · ${new Date().toLocaleDateString(undefined,{month:'long'})}</h2>${brows}<div class="chips" style="margin:10px 0 0"><input id="bcat" placeholder="Category" style="width:160px"><input id="blimit" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Monthly limit" style="width:150px"><button class="btn pri" onclick="addBudget()">Set budget</button></div><p class="err" id="berr"></p></section>
  <section class="card cp c5"><h2>Debts</h2>${drows}<div class="chips" style="margin:10px 0 0"><input id="dcred" placeholder="Creditor" style="width:150px"><input id="damt" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Amount owed" style="width:140px"><input id="drate" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Interest %" style="width:110px"><button class="btn pri" onclick="addDebt()">Add debt</button></div><p class="err" id="derr"></p></section>
 </div>`;
}
const addTx=()=>act(async()=>{const amt=parseFloat($('#famt').value);if(!(amt>0)){$('#ferr').textContent='Enter an amount greater than 0.';return}await api('/finance/transactions',{method:'POST',body:JSON.stringify({kind:$('#fkind').value,amount:amt,currency:PREFS.currency,category:$('#fcat').value.trim()||'general',description:$('#fdesc').value.trim()||null,occurred_on:$('#fdate').value||null})});toast('Transaction added');render()});
const addBudget=()=>act(async()=>{const cat=$('#bcat').value.trim();if(!cat){$('#berr').textContent='Name a category.';return}const lim=parseFloat($('#blimit').value);if(!(lim>=0)){$('#berr').textContent='Enter a monthly limit.';return}await api('/finance/budgets',{method:'POST',body:JSON.stringify({category:cat,limit_amount:lim})});toast('Budget saved');render()});
const addDebt=()=>act(async()=>{const cred=$('#dcred').value.trim();if(!cred){$('#derr').textContent='Name the creditor.';return}const amt=parseFloat($('#damt').value);if(!(amt>=0)){$('#derr').textContent='Enter the amount owed.';return}const rate=parseFloat($('#drate').value);await api('/finance/debts',{method:'POST',body:JSON.stringify({creditor:cred,original_amount:amt,interest_rate:rate>=0?rate:null})});toast('Debt added');render()});
const repay=id=>act(async()=>{const amt=parseFloat($('#rp_'+id).value);if(!(amt>0)){toast('Enter a repayment amount');return}await api('/finance/debts/'+id+'/repayments',{method:'POST',body:JSON.stringify({amount:amt})});toast('Repayment recorded');render()});

/* settings + shared prefs */
const APP_VERSION='1.0.0';
let PREFS={currency:'NGN',date_format:'DMY',timezone:'Africa/Lagos',theme:null};
const gdate=d=>{if(!d)return'';if(PREFS.date_format==='ISO'||PREFS.date_format==='YMD')return d;const t=new Date(d+'T00:00'),mo=t.toLocaleDateString(undefined,{month:'short'}),da=t.getDate();return PREFS.date_format==='MDY'?`${mo} ${da}`:`${da} ${mo}`};
async function loadPrefs(){try{const p=await api('/settings/prefs');PREFS={currency:p.currency||'NGN',date_format:p.date_format||'DMY',timezone:p.timezone||'Africa/Lagos',theme:p.theme||null};if(PREFS.theme&&!localStorage.getItem('th')){if(PREFS.theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=PREFS.theme}}catch(e){}}
const setTheme=mode=>act(async()=>{const d=document.documentElement;if(mode==='system'){d.removeAttribute('data-theme');localStorage.removeItem('th')}else{d.dataset.theme=mode;localStorage.setItem('th',mode)}PREFS.theme=mode;try{await api('/settings/prefs',{method:'PUT',body:JSON.stringify({theme:mode})})}catch(e){}render()});
const savePrefs=()=>act(async()=>{const cur=($('#pcur').value.trim().toUpperCase())||'NGN';if(cur.length!==3){$('#prerr').textContent='Currency must be a 3-letter code.';return}const p=await api('/settings/prefs',{method:'PUT',body:JSON.stringify({currency:cur,date_format:$('#pdf').value,timezone:$('#ptz').value.trim()||'Africa/Lagos'})});PREFS={...PREFS,currency:p.currency,date_format:p.date_format,timezone:p.timezone};toast('Preferences saved');render()});
const savePw=()=>act(async()=>{const c=$('#pwc').value,n=$('#pwn').value,n2=$('#pwn2').value;if(n.length<8){$('#pwerr').textContent='New password must be at least 8 characters.';return}if(n!==n2){$('#pwerr').textContent='New passwords do not match.';return}await api('/auth/password',{method:'POST',body:JSON.stringify({current:c,new_password:n})});toast('Password changed');$('#pwc').value='';$('#pwn').value='';$('#pwn2').value=''});

 const p=await api('/settings/prefs');
 const tmode=localStorage.getItem('th')||(p.theme||'system');
 const ex={DMY:'20 Nov 2026',MDY:'Nov 20 2026',YMD:'2026-11-20',ISO:'2026-11-20'};
 return `<div class="hd"><div><h1>Settings</h1><p class="mu">Account, appearance and preferences</p></div></div><div class="grid">

  <section class="card cp c7"><h2>Preferences</h2>
   <label for="pcur">Default currency (3-letter code)</label><input id="pcur" maxlength="3" value="${esc(p.currency||'NGN')}" style="width:120px;text-transform:uppercase">
   <label for="pdf">Date format</label><select id="pdf">${['DMY','MDY','YMD','ISO'].map(v=>`<option value="${v}" ${p.date_format===v?'selected':''}>${v} — ${ex[v]}</option>`).join('')}</select>

  <section class="card cp c5"><h2>Notifications</h2><p class="mu sm">New-job alerts and daily meal and exercise ideas are sent by your n8n automations and email. Turn them on or off, or reconnect Gmail, in your n8n workflows.</p>
   <h2 style="margin-top:14px">Privacy &amp; security</h2><p class="mu sm">You're signed in with a 30-day token kept on this device. Sign out to remove it here. Your data and chat media live in your own Postgres database and are included in the nightly backup.</p>
   <h2 style="margin-top:14px">About</h2><p class="mu sm">Personal OS v${APP_VERSION} · offline cache pos-v11</p>
   <button class="btn" style="margin-top:8px" onclick="logout()">Sign out</button></section>
 </div>`;
}
